[Unit]
# Ensure apache2 only starts after cloudstack early-config has run, so the
# config files (sites-enabled, ports.conf) are properly initialized.
# Without this, on systemvm boot apache2 starts in parallel with
# cloud-early-config, finds no Listen directives, fails with "no listening
# sockets available", and that cascades into SetupGuestNetworkCommand
# failure on redundant VRs (tier never implements).
After=cloud-early-config.service
Requires=cloud-early-config.service
