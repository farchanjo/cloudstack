#
# Strategic merge patch that makes the cloudstack-csi-node DaemonSet trust an
# internally-signed CloudStack CA. Applied by the deploy-csi-driver script only
# when /opt/csi/cloudstack-ca.crt exists on the control node (see
# KubernetesClusterActionWorker#deployCloudStackCaTrust). Clouds fronted by a
# publicly-trusted CA never get the cloudstack-ca ConfigMap, so this patch is a
# no-op for them.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cloudstack-csi-node
  namespace: kube-system
spec:
  template:
    spec:
      volumes:
        - name: cloudstack-ca
          configMap:
            name: cloudstack-ca
      containers:
        - name: cloudstack-csi-node
          env:
            - name: SSL_CERT_FILE
              value: /etc/cloudstack-ca/ca.crt
          volumeMounts:
            - name: cloudstack-ca
              mountPath: /etc/cloudstack-ca
              readOnly: true
