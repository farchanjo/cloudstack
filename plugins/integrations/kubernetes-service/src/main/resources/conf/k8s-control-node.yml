---
# Runs in the cloud-init init stage, after networking.service has already raised eth0 from
# the image's baked-in v4-only /etc/network/interfaces. On dual-stack clusters the image
# also ships with IPv6 fully disabled (net.ipv6.conf.all.disable_ipv6 = 1 in
# /etc/sysctl.conf), so this block (1) enables IPv6 plus the v6 forwarding and
# bridge-nf-call-ip6tables sysctls required by the kubeadm dual-stack preflight and
# kube-proxy/Calico, persisting them for later boots, and (2) applies the static v6
# address that cloud-init rendered into interfaces.d/50-cloud-init - that stanza is never
# applied on first boot because the file is written after networking.service ran (and v6
# was still disabled at that point), leaving the NIC with link-local only and crashing
# calico-node (IP6=autodetect). The guard renders as `if [ "true"/"false" = "true" ]`, so
# it is an inert no-op on v4-only clusters (executes but changes nothing).
bootcmd:
  - |
    if [ "{{ k8s.dual.stack }}" = "true" ]; then
      echo "Enabling IPv6 for dual-stack Kubernetes networking"
      sysctl -w net.ipv6.conf.all.disable_ipv6=0
      sysctl -w net.ipv6.conf.default.disable_ipv6=0
      sysctl -w net.ipv6.conf.all.forwarding=1
      sysctl -w net.ipv6.conf.default.forwarding=1
      modprobe br_netfilter || true
      sysctl -w net.bridge.bridge-nf-call-ip6tables=1 || true
      mkdir -p /etc/sysctl.d
      printf 'net.ipv6.conf.all.disable_ipv6 = 0\nnet.ipv6.conf.default.disable_ipv6 = 0\nnet.ipv6.conf.all.forwarding = 1\nnet.ipv6.conf.default.forwarding = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\n' > /etc/sysctl.d/99-cks-dualstack.conf
      # /etc/sysctl.conf ships disable_ipv6=1 and systemd-sysctl applies it as
      # 99-sysctl.conf, which sorts AFTER 99-cks-dualstack.conf and would re-disable
      # IPv6 on the next boot / `sysctl --system`. Neutralize the base file so the
      # drop-in wins persistently (mirrors the arp_* seds in setup-kube-system).
      if [ -f /etc/sysctl.conf ]; then
        sed -i 's/^[[:space:]]*net.ipv6.conf.all.disable_ipv6[[:space:]]*=.*/net.ipv6.conf.all.disable_ipv6 = 0/' /etc/sysctl.conf
        sed -i 's/^[[:space:]]*net.ipv6.conf.default.disable_ipv6[[:space:]]*=.*/net.ipv6.conf.default.disable_ipv6 = 0/' /etc/sysctl.conf
      fi
      ENI=/etc/network/interfaces.d/50-cloud-init
      if [ -f "$ENI" ]; then
        V6IF=$(awk '$1=="iface" && $3=="inet6" {print $2; exit}' "$ENI")
        V6ADDR=$(awk '$1=="iface" {in6=($3=="inet6")} in6 && $1=="address" {print $2; exit}' "$ENI")
        V6GW=$(awk '$1=="iface" {in6=($3=="inet6")} in6 && $1=="post-up" && $5=="inet6" && $6=="default" {print $8; exit}' "$ENI")
        if [ -n "$V6IF" ] && [ -n "$V6ADDR" ]; then
          case "$V6ADDR" in */*) : ;; *) V6ADDR="$V6ADDR/64" ;; esac
          ip -6 addr replace "$V6ADDR" dev "$V6IF" || true
          if [ -n "$V6GW" ]; then
            ip -6 route replace default via "$V6GW" dev "$V6IF" || true
          fi
        fi
      fi
    fi

users:
  - name: cloud
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      {{ k8s.ssh.pub.key }}

write_files:
  - path: /etc/conf.d/nfs
    permissions: '0644'
    content: |
      OPTS_RPC_MOUNTD=""

  - path: /etc/kubernetes/pki/cloudstack/ca.crt
    permissions: '0644'
    content: |
      {{ k8s_control_node.ca.crt }}

  - path: /etc/kubernetes/pki/cloudstack/apiserver.crt
    permissions: '0644'
    content: |
      {{ k8s_control_node.apiserver.crt }}

  - path: /etc/kubernetes/pki/cloudstack/apiserver.key
    permissions: '0600'
    content: |
      {{ k8s_control_node.apiserver.key }}

  - path: /opt/bin/setup-kube-system
    permissions: '0700'
    owner: root:root
    content: |
      #!/bin/bash -e

      if [[ -f "/home/cloud/success" ]]; then
      echo "Already provisioned!"
      exit 0
      fi

      sysctl net.ipv4.conf.default.arp_announce=0
      sysctl net.ipv4.conf.default.arp_ignore=0
      sysctl net.ipv4.conf.all.arp_announce=0
      sysctl net.ipv4.conf.all.arp_ignore=0
      sysctl net.ipv4.conf.eth0.arp_announce=0 || sysctl net.ipv4.conf.ens35.arp_announce=0 || true
      sysctl net.ipv4.conf.eth0.arp_ignore=0 || sysctl net.ipv4.conf.ens35.arp_ignore=0 || true
      sed -i "s/net.ipv4.conf.default.arp_announce =.*$/net.ipv4.conf.default.arp_announce = 0/" /etc/sysctl.conf
      sed -i "s/net.ipv4.conf.default.arp_ignore =.*$/net.ipv4.conf.default.arp_ignore = 0/" /etc/sysctl.conf
      sed -i "s/net.ipv4.conf.all.arp_announce =.*$/net.ipv4.conf.all.arp_announce = 0/" /etc/sysctl.conf
      sed -i "s/net.ipv4.conf.all.arp_ignore =.*$/net.ipv4.conf.all.arp_ignore = 0/" /etc/sysctl.conf

      ISO_MOUNT_DIR=/mnt/k8sdisk
      BINARIES_DIR=${ISO_MOUNT_DIR}/
      K8S_CONFIG_SCRIPTS_COPY_DIR=/tmp/k8sconfigscripts/
      ATTEMPT_ONLINE_INSTALL=false
      setup_complete=false

      OFFLINE_INSTALL_ATTEMPT_SLEEP={{ k8s.install.wait.time }}
      MAX_OFFLINE_INSTALL_ATTEMPTS={{ k8s.install.reattempts.count }}
      if [[ -z $OFFLINE_INSTALL_ATTEMPT_SLEEP || $OFFLINE_INSTALL_ATTEMPT_SLEEP -eq 0 ]]; then
        OFFLINE_INSTALL_ATTEMPT_SLEEP=15
      fi
      if [[ -z $MAX_OFFLINE_INSTALL_ATTEMPTS || $MAX_OFFLINE_INSTALL_ATTEMPTS -eq 0 ]]; then
        MAX_OFFLINE_INSTALL_ATTEMPTS=100
      fi
      offline_attempts=1
      MAX_SETUP_CRUCIAL_CMD_ATTEMPTS=3
      EJECT_ISO_FROM_OS={{ k8s.eject.iso }}
      crucial_cmd_attempts=1
      iso_drive_path=""
      while true; do
        if (( "$offline_attempts" > "$MAX_OFFLINE_INSTALL_ATTEMPTS" )); then
          echo "Warning: Offline install timed out!"
          break
        fi
        set +e
        output=`blkid -o device -t LABEL=CDROM`
        set -e
        if [ "$output" != "" ]; then
          while read -r line; do
            if [ ! -d "${ISO_MOUNT_DIR}" ]; then
              mkdir "${ISO_MOUNT_DIR}"
            fi
            retval=0
            set +e
            mount -o ro "${line}" "${ISO_MOUNT_DIR}"
            retval=$?
            set -e
            if [ $retval -eq 0 ]; then
              if [ -d "$BINARIES_DIR" ]; then
                iso_drive_path="${line}"
                break
              else
                umount "${line}" && rmdir "${ISO_MOUNT_DIR}"
              fi
            fi
          done <<< "$output"
        fi
        if [ -d "$BINARIES_DIR" ]; then
          break
        fi
        echo "Waiting for Binaries directory $BINARIES_DIR to be available, sleeping for $OFFLINE_INSTALL_ATTEMPT_SLEEP seconds, attempt: $offline_attempts"
        sleep $OFFLINE_INSTALL_ATTEMPT_SLEEP
        offline_attempts=$[$offline_attempts + 1]
      done

      if [[ "$PATH" != *:/opt/bin && "$PATH" != *:/opt/bin:* ]]; then
        export PATH=$PATH:/opt/bin
      fi

      if [ -d "$BINARIES_DIR" ]; then
        ### Binaries available offline ###
        echo "Installing binaries from ${BINARIES_DIR}"
        mkdir -p /opt/cni/bin
        tar -f "${BINARIES_DIR}/cni/cni-plugins-"*64.tgz -C /opt/cni/bin -xz

        mkdir -p /opt/bin
        tar -f "${BINARIES_DIR}/cri-tools/crictl-linux-"*64.tar.gz -C /opt/bin -xz

        mkdir -p /opt/bin
        cd /opt/bin
        cp -a ${BINARIES_DIR}/k8s/{kubeadm,kubelet,kubectl} .
        chmod +x {kubeadm,kubelet,kubectl}

        sed "s:/usr/bin:/opt/bin:g" ${BINARIES_DIR}/kubelet.service > /etc/systemd/system/kubelet.service
        mkdir -p /etc/systemd/system/kubelet.service.d
        sed "s:/usr/bin:/opt/bin:g" ${BINARIES_DIR}/10-kubeadm.conf > /etc/systemd/system/kubelet.service.d/10-kubeadm.conf

        echo "KUBELET_EXTRA_ARGS=--cgroup-driver=systemd{{ k8s.kubelet.node.ip.args }}" > /etc/default/kubelet

        output=`ls ${BINARIES_DIR}/docker/`
        if [ "$output" != "" ]; then
          while read -r line; do
            crucial_cmd_attempts=1
            while true; do
              if (( "$crucial_cmd_attempts" > "$MAX_SETUP_CRUCIAL_CMD_ATTEMPTS" )); then
                echo "Loading docker image ${BINARIES_DIR}/docker/$line failed!"
                break;
              fi
              retval=0
              set +e
              ctr -n k8s.io image import "${BINARIES_DIR}/docker/$line"
              retval=$?
              set -e
              if [ $retval -eq 0 ]; then
                break;
              fi
              crucial_cmd_attempts=$[$crucial_cmd_attempts + 1]
            done
          done <<< "$output"
          setup_complete=true
        fi
        mkdir -p "${K8S_CONFIG_SCRIPTS_COPY_DIR}"
        cp ${BINARIES_DIR}/*.yaml "${K8S_CONFIG_SCRIPTS_COPY_DIR}"
        if [ -e "${BINARIES_DIR}/autoscaler.yaml" ]; then
          mkdir -p /opt/autoscaler
          cp "${BINARIES_DIR}/autoscaler.yaml" /opt/autoscaler/autoscaler_tmpl.yaml
        fi
        if [ -e "${BINARIES_DIR}/provider.yaml" ]; then
          mkdir -p /opt/provider
          cp "${BINARIES_DIR}/provider.yaml" /opt/provider/provider.yaml
        fi
        if [ -e "${BINARIES_DIR}/snapshot-crds.yaml" ]; then
          mkdir -p /opt/csi
          cp "${BINARIES_DIR}/snapshot-crds.yaml" /opt/csi/snapshot-crds.yaml
          cp "${BINARIES_DIR}/manifest.yaml" /opt/csi/manifest.yaml
        fi

        PAUSE_IMAGE=`ctr -n k8s.io images ls -q | grep "pause" | sort | tail -n 1`
        echo $PAUSE_IMAGE
        if [ -n "$PAUSE_IMAGE" ]; then
          sed -i "s|sandbox_image = .*|sandbox_image = \"$PAUSE_IMAGE\"|g" /etc/containerd/config.toml
        fi
        systemctl daemon-reload
        systemctl restart containerd

        umount "${ISO_MOUNT_DIR}" && rmdir "${ISO_MOUNT_DIR}"
        if [ "$EJECT_ISO_FROM_OS" = true ] && [ "$iso_drive_path" != "" ]; then
          eject "${iso_drive_path}"
        fi
      fi
      if [ "$setup_complete" = false ] && [ "$ATTEMPT_ONLINE_INSTALL" = true ]; then
        ###  Binaries not available offline ###
        RELEASE="v1.16.3"
        CNI_VERSION="v0.7.5"
        CRICTL_VERSION="v1.16.0"
        echo "Warning: ${BINARIES_DIR} not found. Will get binaries and docker images from Internet."
        mkdir -p /opt/cni/bin
        curl -L "https://github.com/containernetworking/plugins/releases/download/${CNI_VERSION}/cni-plugins-amd64-${CNI_VERSION}.tgz" | tar -C /opt/cni/bin -xz

        mkdir -p /opt/bin
        curl -L "https://github.com/kubernetes-incubator/cri-tools/releases/download/${CRICTL_VERSION}/crictl-${CRICTL_VERSION}-linux-amd64.tar.gz" | tar -C /opt/bin -xz

        mkdir -p /opt/bin
        cd /opt/bin
        curl -L --remote-name-all https://storage.googleapis.com/kubernetes-release/release/${RELEASE}/bin/linux/amd64/{kubeadm,kubelet,kubectl}
        chmod +x {kubeadm,kubelet,kubectl}

        curl -sSL "https://raw.githubusercontent.com/kubernetes/kubernetes/${RELEASE}/build/debs/kubelet.service" | sed "s:/usr/bin:/opt/bin:g" > /etc/systemd/system/kubelet.service
        mkdir -p /etc/systemd/system/kubelet.service.d
        curl -sSL "https://raw.githubusercontent.com/kubernetes/kubernetes/${RELEASE}/build/debs/10-kubeadm.conf" | sed "s:/usr/bin:/opt/bin:g" > /etc/systemd/system/kubelet.service.d/10-kubeadm.conf
      fi

      systemctl enable kubelet && systemctl start kubelet
      modprobe overlay && modprobe br_netfilter && sysctl net.bridge.bridge-nf-call-iptables=1

      if [ -d "$BINARIES_DIR" ] && [ "$ATTEMPT_ONLINE_INSTALL" = true ]; then
        crucial_cmd_attempts=1
        while true; do
          if (( "$crucial_cmd_attempts" > "$MAX_SETUP_CRUCIAL_CMD_ATTEMPTS" )); then
            echo "Warning: kubeadm pull images failed after multiple tries!"
            break;
          fi
          retval=0
          set +e
          kubeadm config images pull --cri-socket /run/containerd/containerd.sock
          retval=$?
          set -e
          if [ $retval -eq 0 ]; then
            break;
          fi
          crucial_cmd_attempts=$[$crucial_cmd_attempts + 1]
        done
      fi

  - path: /etc/kubernetes/kubeadm-config.yaml
    permissions: '0644'
    owner: root:root
    content: |
      apiVersion: kubeadm.k8s.io/v1beta3
      kind: ClusterConfiguration
      apiServer:
        certSANs:
        {{ k8s_control.server_ips }}
      controlPlaneEndpoint: {{ k8s_control.server_ip }}:{{ k8s.api_server_port }}
      etcd:
        external:
          endpoints:
          {{ etcd.etcd_endpoint_list }}
      ---
      apiVersion: kubeadm.k8s.io/v1beta3
      kind: InitConfiguration
      bootstrapTokens:
        - token: "{{ k8s_control_node.cluster.token }}"
          ttl: "0"
      nodeRegistration:
        criSocket: /run/containerd/containerd.sock
      localAPIEndpoint:
        advertiseAddress: {{ k8s_control.server_ip }}
        bindPort: {{ k8s.api_server_port }}
      certificateKey: {{ k8s_control.certificate_key }}


  - path: /opt/bin/deploy-kube-system
    permissions: '0700'
    owner: root:root
    content: |
      #!/bin/bash -e

      if [[ -f "/home/cloud/success" ]]; then
      echo "Already provisioned!"
      exit 0
      fi

      if [[ "$PATH" != *:/opt/bin && "$PATH" != *:/opt/bin:* ]]; then
        export PATH=$PATH:/opt/bin
      fi

      EXTERNAL_ETCD_NODES={{ etcd.unstacked_etcd }}
      EXTERNAL_CNI_PLUGIN={{ k8s.external.cni.plugin }}
      if [[ -f /etc/kubernetes/admin.conf ]]; then
        echo "kubeadm init already completed (/etc/kubernetes/admin.conf exists); skipping init"
      else
        MAX_SETUP_CRUCIAL_CMD_ATTEMPTS=3
        crucial_cmd_attempts=1
        while true; do
          if (( "$crucial_cmd_attempts" > "$MAX_SETUP_CRUCIAL_CMD_ATTEMPTS" )); then
            echo "Error: kubeadm init failed!"
            exit 1
          fi
          retval=0
          set +e
          if [[ ${EXTERNAL_ETCD_NODES} == true ]]; then
            kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --upload-certs
          else
            kubeadm init --token {{ k8s_control_node.cluster.token }} --token-ttl 0 {{ k8s_control_node.cluster.initargs }} --cri-socket /run/containerd/containerd.sock
          fi
          retval=$?
          set -e
          if [ $retval -eq 0 ]; then
            break;
          fi
          crucial_cmd_attempts=$[$crucial_cmd_attempts + 1]
        done
      fi

      K8S_CONFIG_SCRIPTS_COPY_DIR=/tmp/k8sconfigscripts/

      gate_wait_attempts=1
      while [[ $(systemctl is-active setup-kube-system) != "inactive" ]]; do
        if (( "$gate_wait_attempts" > 60 )); then
          echo "Error: setup-kube-system did not finish in time!"
          exit 1
        fi
        echo "Waiting for setup-kube-system to finish..."
        sleep 10
        gate_wait_attempts=$[$gate_wait_attempts + 1]
      done
      if [[ "$PATH" != *:/opt/bin && "$PATH" != *:/opt/bin:* ]]; then
        export PATH=$PATH:/opt/bin
      fi
      export KUBECONFIG=/etc/kubernetes/admin.conf

      mkdir -p /root/.kube
      cp -f /etc/kubernetes/admin.conf /root/.kube/config
      chown $(id -u):$(id -g) /root/.kube/config
      echo export PATH=\$PATH:/opt/bin >> /root/.bashrc

      if [ -d "$K8S_CONFIG_SCRIPTS_COPY_DIR" ]; then
        ### Network, dashboard configs available offline ###
        echo "Offline configs are available!"
        if [[ ${EXTERNAL_CNI_PLUGIN} == false ]]; then
          if [[ "{{ k8s.dual.stack }}" == "true" ]]; then
            echo "Enabling Calico IPv6 pod address assignment in the CNI config"
            # calico-ipam defaults assign_ipv6 to false; without this every pod stays
            # v4-only even with FELIX_IPV6SUPPORT and a v6 IPPool in place. Patch the
            # manifest before it is applied so all pods get dual IPs from the start.
            sed -i 's/"type": "calico-ipam"/"type": "calico-ipam", "assign_ipv4": "true", "assign_ipv6": "true"/' ${K8S_CONFIG_SCRIPTS_COPY_DIR}/network.yaml || true
          fi
          CALICO_POD_CIDR_V4="{{ k8s.calico.pod.cidr.v4 }}"
          if [ -n "$CALICO_POD_CIDR_V4" ]; then
            # Per-cluster IPv4 pod CIDR override (recreate-durable via the calico.pod.cidr.v4
            # cluster detail). The upstream Calico manifest ships CALICO_IPV4POOL_CIDR commented
            # out, so a plain value swap on that dead line had no effect and calico-node kept
            # auto-creating the built-in default 192.168.0.0/16 pool. Uncomment the env var and set
            # our CIDR so calico-node creates default-ipv4-ippool with the desired range at startup
            # (the env is read before the default pool is created, so it is race-free on a fresh
            # cluster). blockSize 26 is the Calico IPv4 default, so only the CIDR is set.
            echo "Overriding Calico IPv4 pod CIDR to $CALICO_POD_CIDR_V4"
            sed -i -E -e 's|^([[:space:]]*)#[[:space:]]*- name: CALICO_IPV4POOL_CIDR|\1- name: CALICO_IPV4POOL_CIDR|' -e "s|^([[:space:]]*)#[[:space:]]*value: \"192\.168\.0\.0/16\"|\1  value: \"${CALICO_POD_CIDR_V4}\"|" ${K8S_CONFIG_SCRIPTS_COPY_DIR}/network.yaml || true
          fi
          /opt/bin/kubectl apply -f ${K8S_CONFIG_SCRIPTS_COPY_DIR}/network.yaml
          if [[ "{{ k8s.dual.stack }}" == "true" ]]; then
            echo "Enabling Calico IPv6 dual-stack support"
            /opt/bin/kubectl -n kube-system set env daemonset/calico-node FELIX_IPV6SUPPORT=true IP6=autodetect || true
            printf 'apiVersion: crd.projectcalico.org/v1\nkind: IPPool\nmetadata:\n  name: default-ipv6-ippool\nspec:\n  cidr: {{ k8s.calico.pod.cidr.v6 }}\n  natOutgoing: true\n  vxlanMode: Never\n  nodeSelector: all()\n' | /opt/bin/kubectl apply -f - || true
          fi
        fi
        if [ -f "${K8S_CONFIG_SCRIPTS_COPY_DIR}/headlamp.yaml" ]; then
          echo "Installing Headlamp dashboard from ISO"
          /opt/bin/kubectl apply -f ${K8S_CONFIG_SCRIPTS_COPY_DIR}/headlamp.yaml
        elif [ -f "${K8S_CONFIG_SCRIPTS_COPY_DIR}/dashboard.yaml" ]; then
          echo "Installing Kubernetes Dashboard from ISO"
          /opt/bin/kubectl apply -f ${K8S_CONFIG_SCRIPTS_COPY_DIR}/dashboard.yaml
          /opt/bin/kubectl create rolebinding admin-binding --role=admin --user=admin || true
          /opt/bin/kubectl create clusterrolebinding cluster-admin-binding --clusterrole=cluster-admin --user=admin || true
          /opt/bin/kubectl create clusterrolebinding kubernetes-dashboard-ui --clusterrole=cluster-admin --serviceaccount=kubernetes-dashboard:kubernetes-dashboard || true
        else
          echo "Warning: No dashboard YAML found in ISO (neither headlamp.yaml nor dashboard.yaml)"
        fi
        rm -rf "${K8S_CONFIG_SCRIPTS_COPY_DIR}"
      else
        ### Online installation - use Headlamp by default ###
        /opt/bin/kubectl apply -f "https://cloud.weave.works/k8s/net?k8s-version=$(/opt/bin/kubectl version | base64 | tr -d '\n')"
        /opt/bin/kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/headlamp/v0.40.1/kubernetes-headlamp.yaml
        /opt/bin/kubectl create serviceaccount headlamp-admin -n kube-system || true
        /opt/bin/kubectl create clusterrolebinding headlamp-admin --clusterrole=cluster-admin --serviceaccount=kube-system:headlamp-admin || true
      fi

      /opt/bin/kubectl create rolebinding admin-binding --role=admin --user=admin || true
      /opt/bin/kubectl create clusterrolebinding cluster-admin-binding --clusterrole=cluster-admin --user=admin || true

      sudo touch /home/cloud/success
      echo "true" > /home/cloud/success

  {% if registry is defined %}
  - path: /opt/bin/setup-containerd
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/bash -e

      export registryConfig="\\        [plugins.\"io.containerd.grpc.v1.cri\".registry.mirrors.\"{{registry.url.endpoint}}\"]\n \\         endpoint = [\"{{registry.url}}\"]"
      export registryCredentials="\\      [plugins.\"io.containerd.grpc.v1.cri\".registry.configs.\"{{registry.url.endpoint}}\".auth]\n\tusername = \"{{registry.username}}\" \n\tpassword = \"{{registry.password}}\" \n\tidentitytoken = \"{{registry.token}}\""

      echo "creating config file for containerd"
      containerd config default > /etc/containerd/config.toml
      sed  -i '/\[plugins."io.containerd.grpc.v1.cri".registry\]/a '"${registryCredentials}"'' /etc/containerd/config.toml
      sed  -i '/\[plugins."io.containerd.grpc.v1.cri".registry.mirrors\]/a '"${registryConfig}"'' /etc/containerd/config.toml

      echo "Restarting containerd service"
      systemctl daemon-reload
      systemctl restart containerd
  {% endif %}

  - path: /etc/systemd/system/deploy-kube-system.service
    permissions: '0755'
    owner: root:root
    content: |
      [Unit]
      Requires=containerd.service
      After=containerd.service

      [Service]
      Type=simple
      StartLimitInterval=0
      Restart=on-failure
      ExecStart=/opt/bin/deploy-kube-system

runcmd:
  - chown -R cloud:cloud /home/cloud/.ssh
  - containerd config default > /etc/containerd/config.toml
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
  - until [ -f /opt/bin/setup-kube-system ]; do sleep 5; done
  - /opt/bin/setup-kube-system
  - until [ -f /etc/systemd/system/deploy-kube-system.service ]; do sleep 5; done
  - systemctl start deploy-kube-system
