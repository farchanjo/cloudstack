db.ha.enabled=false
db.cloud.driver=jdbc:mysql
db.cloud.uri=jdbc:mysql://${env.VF_MYSQL_IT_HOST}:${env.VF_MYSQL_IT_PORT}/${env.VF_MYSQL_IT_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.cloud.username=${env.VF_MYSQL_IT_USERNAME}
db.cloud.password=${env.VF_MYSQL_IT_PASSWORD}
db.cloud.connectionPoolLib=hikaricp
db.cloud.maxActive=12
db.cloud.maxIdle=12
db.cloud.minIdleConnections=1
db.cloud.maxWait=10000
db.cloud.connectionTimeout=10000
db.cloud.keepAliveTime=0
db.cloud.validationQuery=SELECT 1
db.cloud.isolation.level=repeatableread
db.cloud.testOnBorrow=true
db.cloud.testWhileIdle=false
db.cloud.timeBetweenEvictionRunsMillis=60000
db.cloud.minEvictableIdleTimeMillis=60000
db.cloud.useSSL=false
db.usage.driver=jdbc:mysql
db.usage.uri=jdbc:mysql://${env.VF_MYSQL_IT_HOST}:${env.VF_MYSQL_IT_PORT}/${env.VF_MYSQL_IT_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.usage.username=${env.VF_MYSQL_IT_USERNAME}
db.usage.password=${env.VF_MYSQL_IT_PASSWORD}
db.usage.connectionPoolLib=hikaricp
db.usage.maxActive=2
db.usage.maxIdle=2
db.usage.minIdleConnections=0
db.usage.maxWait=10000
db.usage.connectionTimeout=10000
db.usage.keepAliveTime=0
